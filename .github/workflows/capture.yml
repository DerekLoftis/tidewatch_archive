# Archive FloodVISION-AI's webcam water levels for USLN-X (floodvision.py) and GreenStream's CNRC
# sensor (greenstream.py) ahead of each 6-hourly site build, and hourly NWPS water levels for the
# stand-in stations (nwps_capture.py). All three sources keep about 30 days, so a missed run loses
# nothing. The monthly CSVs are committed under tidewatch_site/ (floodvision/, greenstream/, nwps/);
# the site build publishes floodvision/ and greenstream/ as obs/ on the public site for StormSense.
# cron-job.org dispatches it at :05 past 00, 06, 12 and 18 UTC.
name: Capture USLN-X, CNRC and NWPS stand-ins

on:
  # run by cron-job.org (dispatch at the times in the header); GitHub's own cron ran hours late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tidewatch_site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - run: python floodvision.py floodvision
        continue-on-error: true
      - run: python greenstream.py greenstream
        continue-on-error: true
      - run: python nwps_capture.py nwps
        continue-on-error: true
      - name: Commit new rows
        run: |
          git config user.name "tidewatch-archive"
          git config user.email "actions@users.noreply.github.com"
          git add floodvision greenstream nwps
          git diff --cached --quiet && exit 0
          git commit -qm "USLN-X, CNRC and NWPS capture $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep $((2**i)); done
