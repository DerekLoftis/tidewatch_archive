# Archives one run in each 6-hour slot (00/06/12/18Z). GitHub starts scheduled
# runs hours late and sometimes drops them, so the schedule fires hourly and a
# scheduled run exits early when its slot already has a run (data/status.json).
# Each run's files go to a monthly GitHub Release (archive-YYYY-MM) as one
# tarball (about 120 a month, under the 1000-asset limit). The repository keeps
# only the code, data/index and data/status.json, so it stays small.
name: Archive forecasts

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle to archive, e.g. 2026-10-07T00Z (blank = nearest to now)"
        required: false
      jobs:
        description: "Comma list of jobs (blank = whatever is due)"
        required: false

concurrency:
  group: archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this 6-hour slot is already archived
        id: due
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          slot = now.replace(hour=now.hour - now.hour % 6, minute=0, second=0, microsecond=0)
          try:
              last = dt.datetime.fromisoformat(json.load(open("data/status.json"))["tidewatch:f36"]["started_utc"])
          except Exception:
              last = None
          print("skip=" + ("true" if last and last >= slot else "false"))
          PY
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.due.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - run: pip install -r archiver/requirements.txt
        if: steps.due.outputs.skip != 'true'

      - name: Archive
        id: archive
        if: steps.due.outputs.skip != 'true'
        continue-on-error: true
        env:
          CYCLE: ${{ inputs.cycle }}
          JOBS: ${{ inputs.jobs }}
        run: |
          args=()
          [ -n "$CYCLE" ] && args+=(--cycle "$CYCLE")
          [ -n "$JOBS" ] && args+=(--jobs "$JOBS")
          python archiver/twarchive.py --data data run "${args[@]}"

      - name: Upload this run's files to the monthly release
        if: always() && steps.due.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Everything this run saved, as one tarball whose paths match the index.
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          files=$(cd data && find . -mindepth 1 -maxdepth 1 ! -name index ! -name status.json)
          [ -z "$files" ] && { echo "nothing saved"; exit 0; }
          tar czf "run_$stamp.tar.gz" -C data $files
          tag="archive-${stamp:0:7}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Forecast archive ${stamp:0:7}" \
              --notes "Tidewatch, Tidewatch Classic, NWS and model forecasts archived every 6 hours. One tarball per run; data/index lists every file and the cycle it belongs to."
          gh release upload "$tag" "run_$stamp.tar.gz" --clobber

      - name: Commit index and status
        if: always() && steps.due.outputs.skip != 'true'
        run: |
          git config user.name "tidewatch-archive"
          git config user.email "actions@users.noreply.github.com"
          git add data/index data/status.json
          git diff --cached --quiet || git commit -m "Archive $(date -u +%Y-%m-%dT%HZ)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep $((2**i)); done

      - name: Fail the run if a source failed
        if: steps.archive.outcome == 'failure'
        run: |
          cat data/status.json
          exit 1
